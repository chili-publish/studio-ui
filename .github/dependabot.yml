version: 2
updates:
    # FONTAWESOME_NPM_TOKEN is in the Dependabot secrets store.
    # PRs only skip the secret-backed steps (Sonar, Azure, integration secrets, etc)
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      labels:
          - 'No JIRA ticket'
          - 'Skip QA'
